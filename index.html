<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whisper — A Horror Tic Tac Toe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- START SCREEN -->
<section id="start-screen">
  <video autoplay loop muted playsinline id="bg-video">
    <source src="assets/video/bgvideo.mp4" type="video/mp4">
  </video>
  <div class="fog-overlay"></div>

  <button id="mute-toggle" aria-label="Toggle sound">
    <i class="fa-solid fa-volume-xmark"></i>
  </button>

  <div class="start-content">
    <h1 class="game-title flicker">Whisper</h1>
    <p class="game-subtitle">a tic tac toe haunting &mdash; by Shiva Saini</p>
    <button id="start-btn" class="btn-stone">Enter, If You Dare</button>
  </div>
</section>

<!-- GAME SCREEN -->
<main id="game-screen">
  <header class="game-header">
    <h1 class="game-title flicker small">Whisper</h1>
    <p class="game-subtitle">by Shiva Saini</p>
  </header>

  <p id="turn-indicator" class="turn-indicator">Turn: <span id="turn-symbol">O</span></p>

  <div id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
  </div>

  <button id="restart-btn" class="btn-stone">Restart</button>
</main>

<!-- WIN / DRAW OVERLAY -->
<div id="result-overlay">
  <h1 id="result-text"></h1>
</div>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whisper — A Horror Tic Tac Toe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- START SCREEN -->
<section id="start-screen">
  <video autoplay loop muted playsinline id="bg-video">
    <source src="assets/video/bgvideo.mp4" type="video/mp4">
  </video>
  <div class="fog-overlay"></div>

  <button id="mute-toggle" aria-label="Toggle sound">
    <i class="fa-solid fa-volume-xmark"></i>
  </button>

  <button id="settings-toggle" aria-label="Open settings">
    <i class="fa-solid fa-gear"></i>
  </button>

  <div class="start-content">
    <h1 class="game-title flicker">Whisper</h1>
    <p class="game-subtitle">a tic tac toe haunting &mdash; by Shiva Saini</p>
    <button id="start-btn" class="btn-stone">Enter, If You Dare</button>
  </div>
</section>

<!-- SETTINGS PANEL (overlay, accessible from any screen) -->
<div id="settings-panel" class="hidden">
  <div class="settings-content">
    <h2 class="mode-title">Choose Your Dread</h2>

    <div class="theme-options">
      <button class="theme-swatch" data-theme="blood" aria-label="Blood theme">
        <span class="swatch-preview swatch-blood"></span>
        Blood
      </button>
      <button class="theme-swatch" data-theme="ash" aria-label="Ash theme">
        <span class="swatch-preview swatch-ash"></span>
        Ash
      </button>
      <button class="theme-swatch" data-theme="void" aria-label="Void theme">
        <span class="swatch-preview swatch-void"></span>
        Void
      </button>
    </div>

    <button id="close-settings-btn" class="btn-stone">Close</button>
  </div>
</div>

<!-- MODE SELECT SCREEN -->
<section id="mode-screen" class="hidden">
  <button class="back-btn" id="back-to-start-btn" aria-label="Go back">
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <button class="settings-toggle-inline" id="settings-toggle-mode" aria-label="Open settings">
    <i class="fa-solid fa-gear"></i>
  </button>

  <div class="mode-content">
    <h2 class="mode-title">Choose Your Fate</h2>

    <div class="mode-options">
      <button class="btn-stone mode-btn" data-mode="pvp">Two Souls<span class="mode-sub">Play a friend</span></button>
      <button class="btn-stone mode-btn" data-mode="ai">Face the Entity<span class="mode-sub">Play vs AI</span></button>
    </div>

    <div id="difficulty-row" class="mode-options hidden">
      <button class="btn-stone diff-btn" data-difficulty="easy">Restless<span class="mode-sub">Easy</span></button>
      <button class="btn-stone diff-btn" data-difficulty="hard">Merciless<span class="mode-sub">Unbeatable</span></button>
    </div>
  </div>
</section>

<!-- GAME SCREEN -->
<main id="game-screen" class="hidden">
  <button class="back-btn" id="back-to-mode-btn" aria-label="Go back">
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <button class="settings-toggle-inline" id="settings-toggle-game" aria-label="Open settings">
    <i class="fa-solid fa-gear"></i>
  </button>

  <header class="game-header">
    <h1 class="game-title flicker small">Whisper</h1>
    <p class="game-subtitle">by Shiva Saini</p>
  </header>

  <p id="turn-indicator" class="turn-indicator">Turn: <span id="turn-symbol">O</span></p>

  <div id="scoreboard" class="scoreboard">
    <div class="score-item">
      <span id="score-label-o" class="score-label">O</span>
      <span id="score-o" class="score-value">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">Draws</span>
      <span id="score-draw" class="score-value">0</span>
    </div>
    <div class="score-item">
      <span id="score-label-x" class="score-label">X</span>
      <span id="score-x" class="score-value">0</span>
    </div>
  </div>

  <div id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
  </div>

  <div class="game-actions">
    <button id="restart-btn" class="btn-stone">Restart</button>
    <button id="reset-score-btn" class="btn-stone">Reset Score</button>
    <button id="change-mode-btn" class="btn-stone">Change Mode</button>
  </div>
</main>

<!-- WIN / DRAW OVERLAY -->
<div id="result-overlay">
  <h1 id="result-text"></h1>
</div>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>
